<!DOCTYPE html>
{% extends 'Index.html' %}
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<table class="table table-bordered table-head-bg-info table-bordered-bd-info mt-4">
                      <thead>
                        <tr>
                            <th> Username </th>
                            <th> Email address </th>
                          <th>Mobile number </th>
                          <th>Password </th>
                          <th>Confirm password </th>
                          <th>Actions </th>

                        </tr>
                      </thead>
                      <tbody>
                      {% for d in data %}
                        <tr>
                          <td>{{d.Username}}</td>
                          <td>{{d.Email}}</td>
                          <td>{{d.Mobile}}</td>
                          <td>{{d.Password}}</td>
                          <td>{{d.Confirm_password}}</td>
                            <td>

                                  <a href="{% url 'delete_user' pro_id=d.id %}">
                                      <button class="btn btn-danger">Delete</button>
                                  </a>
                              </td>

                        </tr>
                      {% endfor %}
                      </tbody>
                    </table>

</body>
</html>
{% endblock %}
