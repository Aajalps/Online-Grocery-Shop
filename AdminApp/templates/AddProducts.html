    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

        {% if messages %}
  {% for i in messages %}
     {% if i.tags == 'success' %}
        <script>
            swal('{{i}}','','success');
        </script>
     {% elif i.tags == 'error' %}
        <script>
            swal('{{i}}','','error');
        </script>
     {% elif i.tags == 'Warning' %}
        <script>
            swal('{{i}}','','Warning');
        </script>
     {% else %}
        <script>
            swal('{{i}}','','Info');
        </script>

  {% endfor %}
{% endif %}
